<roundcube:include file="/templates/includes/header.html" />

<!-- The Settings ribbon (D-77). Same place as on mail and Contacts:
     outside #layout and above it, spanning the whole window. -->
<roundcube:include file="/templates/includes/ribbonbar-settings.html" />

<!-- Canned responses (BUILD.md §4.4) — the same three panes as Identities. -->
<div id="layout" class="bc-shell bc-shell--settings">
	<roundcube:include file="/templates/includes/menu.html" />
	<roundcube:include file="/templates/includes/settings-menu.html" />

	<div id="layout-list" class="bc-list">
		<div class="bc-pane__head">
			<h1 class="bc-pane__title"><roundcube:label name="responses" /></h1>
			<!-- The create and delete buttons moved into the ribbon at D-77. -->
		</div>

		<div class="bc-list__scroll bc-scroll">
			<roundcube:object name="responseslist" id="responses-table" class="bc-recordlist" noheader="true" />
		</div>
	</div>

	<main id="layout-content" class="bc-reading bc-settings__detail"
		aria-label="<roundcube:label name='responses' />">
		<roundcube:object name="contentframe" id="preferences-frame" class="bc-reading__frame"
			src="env:blankpage" title="responses" />

		<div class="bc-empty bc-reading__empty">
			<svg class="bc-empty__icon" aria-hidden="true"><use href="#ic_fluent_mail_template_20_regular" /></svg>
			<p class="bc-empty__title"><roundcube:label name="bc_noresponseselected" /></p>
			<p class="bc-empty__text"><roundcube:label name="bc_pickresponse" /></p>
		</div>
	</main>
</div>

<roundcube:include file="/templates/includes/footer.html" />
