<!-- Folder pane (BUILD.md §3.4). The <ul id="mailboxlist"> markup is generated by
     rcmail_action::render_folder_tree_html — li.mailbox[.inbox|.drafts|.sent|
     .junk|.trash|.archive][.selected][.unread][.virtual] > a > span.unreadcount,
     plus div.treetoggle.collapsed|expanded for parents. Styled, never replaced. -->
<nav id="layout-sidebar" class="bc-folders" aria-label="<roundcube:label name='folders' />">

	<!-- Icon + localized text. The icon cannot go in content= (that would discard
	     the translated label, and a nested roundcube:label tag inside an
	     attribute is never resolved — parse_xml is a single non-recursive pass),
	     so ui.js prepends it from data-bc-icon. Without JS the button is
	     text-only and still works. -->
	<div class="bc-folders__compose">
		<roundcube:button command="compose" type="link" label="newmessage" title="writenewmessage"
			class="bc-btn bc-btn--primary bc-btn--block" innerclass="bc-btn__label"
			data-bc-icon="compose" />
	</div>

	<div class="bc-folders__scroll bc-scroll">
		<roundcube:object name="mailboxlist" id="mailboxlist" class="bc-folderlist"
			unreadwrap="%s" folder_filter="mail" />

		<roundcube:if condition="env:bc_categories" />
		<div class="bc-folders__divider" role="separator"></div>
		<h3 class="bc-folders__section"><roundcube:label name="bc_labels" /></h3>
		<ul class="bc-labellist" id="bc-labellist">
			<!-- Populated by ui.js from env.bc_categories (BUILD.md §8). Without JS
			     the section stays empty rather than showing broken rows. -->
		</ul>
		<roundcube:endif />
	</div>

	<!-- Quota (§3.4). quota_display() only emits <span id> and defers to
	     rcmail.set_quota(); the Fluent label + 4px bar are rendered by ui.js from
	     the 'setquota' event. Percent text is core's own fallback without JS. -->
	<roundcube:if condition="env:quota" />
	<div class="bc-folders__quota" id="bc-quota">
		<div class="bc-quota__row">
			<span class="bc-quota__label"><roundcube:label name="quota" /></span>
			<roundcube:object name="quotaDisplay" id="quotadisplay" class="bc-quota__value" display="text" />
		</div>
		<div class="bc-quota__track" hidden>
			<div class="bc-quota__fill"></div>
		</div>
	</div>
	<roundcube:endif />
</nav>
