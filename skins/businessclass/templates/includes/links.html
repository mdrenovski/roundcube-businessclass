<!-- Folder pane (BUILD.md §3.4). The <ul id="mailboxlist"> markup is generated by
     rcmail_action::render_folder_tree_html — li.mailbox[.inbox|.drafts|.sent|
     .junk|.trash|.archive][.selected][.unread][.virtual] > a > span.unreadcount,
     plus div.treetoggle.collapsed|expanded for parents. Styled, never replaced. -->
<nav id="layout-sidebar" class="bc-folders" aria-label="<roundcube:label name='folders' />">

	<!-- New Message used to head this pane. It moved into the ribbon at D-75,
	     where Outlook keeps it: one primary button at the left of the command
	     row, above the folder pane rather than inside it. Rendering it here as
	     well would be two buttons on the same command, which core would enable
	     and disable together but a user would read as two different things. -->

	<div class="bc-folders__scroll bc-scroll">

		<!-- Favorites (§3.4, D-74). Roundcube has no pinned-folder concept, so the
		     list is businessclass_prefs' own businessclass_favorites pref; the
		     plugin validates every name against the user's subscribed folders
		     before it reaches env, so nothing here is a string the browser chose.

		     Rendered empty and filled by ui.js from the real folder rows, for the
		     same reason the labels list below is: without JS there is nothing to
		     copy and a hand-built row would be a link core has not wired up. The
		     group hides itself when the list comes out empty. -->
		<div class="bc-folders__group" id="bc-favorites" hidden>
			<button type="button" class="bc-folders__grouphead"
				aria-expanded="true" aria-controls="bc-favlist">
				<svg class="bc-icon bc-icon--16 bc-folders__chevron" aria-hidden="true"><use href="#ic_fluent_chevron_down_20_regular" /></svg>
				<span class="bc-folders__groupname"><roundcube:label name="bc_favorites" /></span>
			</button>

			<div class="bc-folders__groupbody">
				<ul class="bc-folderlist bc-favlist" id="bc-favlist"></ul>
			</div>
		</div>

		<!-- Outlook heads the folder tree with the account it belongs to, and makes
		     that heading collapsible. Roundcube is a single-account client, so this
		     group is never one of several — it is there because a folder tree with
		     no owner named above it reads as the app's folders rather than as this
		     mailbox's.

		     The name is businessclass_prefs' bc_account_email, falling back to
		     core's own username object so the heading still says something with the
		     plugin absent. The condition is inside the span, not around the whole
		     group: the mailboxlist object has to be rendered exactly once, and a
		     branch on either side of it would be two declarations of the same
		     gui object id. -->
		<div class="bc-folders__group">
			<button type="button" class="bc-folders__grouphead"
				aria-expanded="true" aria-controls="bc-folders-account">
				<svg class="bc-icon bc-icon--16 bc-folders__chevron" aria-hidden="true"><use href="#ic_fluent_chevron_down_20_regular" /></svg>
				<span class="bc-folders__groupname"><roundcube:if condition="env:bc_account_email" /><roundcube:var name="env:bc_account_email" /><roundcube:else /><roundcube:object name="username" /><roundcube:endif /></span>
			</button>

			<div class="bc-folders__groupbody" id="bc-folders-account">
				<roundcube:object name="mailboxlist" id="mailboxlist" class="bc-folderlist"
					unreadwrap="%s" folder_filter="mail" />
			</div>
		</div>

		<roundcube:if condition="env:bc_categories" />
		<div class="bc-folders__divider" role="separator"></div>
		<h3 class="bc-folders__section"><roundcube:label name="bc_labels" /></h3>
		<ul class="bc-labellist" id="bc-labellist">
			<!-- Populated by ui.js from env.bc_categories (BUILD.md §8). Without JS
			     the section stays empty rather than showing broken rows. -->
		</ul>
		<roundcube:endif />
	</div>

	<!-- Quota (§3.4). quota_display() only emits <span id> and defers to
	     rcmail.set_quota(); the Fluent label + 4px bar are rendered by ui.js from
	     the 'setquota' event. Percent text is core's own fallback without JS. -->
	<roundcube:if condition="env:quota" />
	<div class="bc-folders__quota" id="bc-quota">
		<div class="bc-quota__row">
			<span class="bc-quota__label"><roundcube:label name="quota" /></span>
			<roundcube:object name="quotaDisplay" id="quotadisplay" class="bc-quota__value" display="text" />
		</div>
		<div class="bc-quota__track" hidden>
			<div class="bc-quota__fill"></div>
		</div>
	</div>
	<roundcube:endif />

	<!-- Needed client-side: ui.js builds the star on every folder row and the
	     Favorites rows themselves. One tag per label (see mail.html). -->
	<roundcube:add_label name="bc_addfavorite" />
	<roundcube:add_label name="bc_removefavorite" />
</nav>
