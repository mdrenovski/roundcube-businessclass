<roundcube:include file="/templates/includes/header.html" />

<!-- The Settings ribbon (D-77). Same place as on mail and Contacts:
     outside #layout and above it, spanning the whole window. -->
<roundcube:include file="/templates/includes/ribbonbar-settings.html" />

<!-- Preferences (BUILD.md §4.4): nav 220 · sections 300 · detail.
     The detail pane is core's contentframe, so each section's form is the
     settingsedit template loaded into an iframe — that is how Roundcube saves
     one section at a time without discarding the others. -->
<div id="layout" class="bc-shell bc-shell--settings">
	<roundcube:include file="/templates/includes/menu.html" />
	<roundcube:include file="/templates/includes/settings-menu.html" />

	<div id="layout-list" class="bc-list">
		<div class="bc-pane__head">
			<h1 class="bc-pane__title"><roundcube:label name="preferences" /></h1>
		</div>

		<div class="bc-list__scroll bc-scroll">
			<!-- noheader: a single column of section names needs no column head,
			     and html_table would otherwise emit a <thead> reading "Section". -->
			<roundcube:object name="sectionslist" id="sections-table" class="bc-recordlist" noheader="true" />
		</div>
	</div>

	<main id="layout-content" class="bc-reading bc-settings__detail"
		aria-label="<roundcube:label name='preferences' />">
		<roundcube:object name="contentframe" id="preferences-frame" class="bc-reading__frame"
			src="env:blankpage" title="arialabelpreferencesform" />

		<!-- Shown until a section is chosen. show_contentframe() only hides the
		     iframe inline, so ui.js marks the pane and this takes over. -->
		<div class="bc-empty bc-reading__empty">
			<svg class="bc-empty__icon" aria-hidden="true"><use href="#ic_fluent_options_20_regular" /></svg>
			<p class="bc-empty__title"><roundcube:label name="bc_nosectionselected" /></p>
			<p class="bc-empty__text"><roundcube:label name="bc_picksection" /></p>
		</div>
	</main>
</div>

<roundcube:include file="/templates/includes/footer.html" />
