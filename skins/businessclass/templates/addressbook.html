<roundcube:include file="/templates/includes/header.html" />

<!-- The Contacts ribbon (D-77). Outside #layout and above it, as on mail. -->
<roundcube:include file="/templates/includes/ribbonbar-contacts.html" />

<!-- Contacts (BUILD.md §4.5): address books 200 · contact list 300 · detail.

     The detail pane is core's contentframe, as on the Settings screens, so the
     contact itself is contact.html loaded into an iframe. That is why §4.5's
     Edit / Compose / Export / Delete toolbar lives out here rather than in the
     frame: all four act on the parent's list selection, and app.js enables and
     disables them from contactlist_select(). A copy inside the frame would have
     no list to read. -->
<div id="layout" class="bc-shell bc-shell--contacts">
	<roundcube:include file="/templates/includes/menu.html" />

	<!-- Address books, their groups, and saved searches. One treelist widget over
	     ul > li.addressbook[.selected][.readonly] > a, with ul.groups >
	     li.contactgroup nested under a book and div.treetoggle for the twisty —
	     the same shape as the mail folder tree, so it reuses .bc-folderlist. -->
	<nav id="layout-sidebar" class="bc-folders bc-directory"
		aria-label="<roundcube:label name='addressbook' />">

		<div class="bc-directory__head">
			<h2 id="bc-label-directory" class="bc-folders__section"><roundcube:label name="bc_addressbooks" /></h2>

			<!-- Group and saved-search actions. §4.5 gives them no home and nothing
			     else can reach them, so they sit behind one overflow button beside
			     the section label. Each item is a roundcube:button, which leaves
			     core owning when it is available: group-rename and group-delete
			     only light up with a group selected, search-delete with a saved
			     search, search-create with a search running. -->
			<div class="bc-popover__anchor">
				<button type="button" id="bc-group-more" class="bc-iconbtn bc-iconbtn--sm"
					aria-haspopup="true" aria-expanded="false" aria-controls="bc-group-menu"
					title="<roundcube:label name='arialabelabookgroupoptions' />">
					<span class="voice"><roundcube:label name="arialabelabookgroupoptions" /></span>
					<svg class="bc-icon bc-icon--16" aria-hidden="true"><use href="#ic_fluent_more_horizontal_20_regular" /></svg>
				</button>

				<div id="bc-group-menu" class="bc-popover bc-popover--form" role="group"
					aria-labelledby="bc-group-more" hidden>
					<roundcube:button command="group-create" type="link"
						class="bc-popover__action" innerclass="bc-btn__label"
						label="addgroup" title="newgroup" data-bc-icon="people_add" />
					<roundcube:button command="group-rename" type="link"
						class="bc-popover__action" innerclass="bc-btn__label"
						label="grouprename" title="grouprename" data-bc-icon="edit" />
					<roundcube:button command="search-create" type="link"
						class="bc-popover__action" innerclass="bc-btn__label"
						label="searchsave" title="searchsave" data-bc-icon="search" />
					<div class="bc-popover__sep" role="separator"></div>
					<roundcube:button command="group-delete" type="link"
						class="bc-popover__action bc-popover__action--danger" innerclass="bc-btn__label"
						label="groupdelete" title="groupdelete" data-bc-icon="delete" />
					<roundcube:button command="search-delete" type="link"
						class="bc-popover__action bc-popover__action--danger" innerclass="bc-btn__label"
						label="searchdelete" title="searchdelete" data-bc-icon="delete" />
					<roundcube:container name="groupoptions" id="bc-group-menu" />
				</div>
			</div>
		</div>

		<div class="bc-folders__scroll bc-scroll">
			<roundcube:object name="directorylist" id="directorylist" class="bc-folderlist bc-directory__books"
				aria-labelledby="bc-label-directory" />

			<!-- Hidden until there is something under it: savedsearchlist always
			     emits its <ul>, empty or not, and a heading over nothing reads as a
			     bug. ui.js unhides this when the list has rows; without JS the
			     searches are simply listed unlabelled. -->
			<div id="bc-savedsearches" hidden>
				<div class="bc-folders__divider" role="separator"></div>
				<h2 id="bc-label-savedsearches" class="bc-folders__section"><roundcube:label name="savedsearches" /></h2>
			</div>
			<roundcube:object name="savedsearchlist" id="savedsearchlist" class="bc-folderlist bc-directory__searches"
				aria-labelledby="bc-label-savedsearches" />
		</div>
	</nav>

	<div id="layout-list" class="bc-list">
		<div class="bc-pane__head">
			<!-- Core rewrites this as you move between books and into a group, and
			     puts the "up one level" affordance in it, so it is the pane title
			     rather than a static label. -->
			<roundcube:object name="addresslisttitle" tag="h1" id="rcmabooklisttitle"
				class="bc-pane__title" label="contacts" />
		</div>

		<h2 id="bc-label-contactslist" class="voice"><roundcube:label name="contacts" /></h2>
		<div id="contacts-content" class="bc-list__scroll bc-scroll">
			<!-- Rows are <tr><td class="name"> plus an empty td.action; the 32px
			     avatar and the email line under the name are added by ui.js from
			     the row data core sends with add_contact_row. role="listbox" cannot
			     ride on the object attributes — html_table drops it (html.php:737) —
			     so ui.js sets it before the widget initialises. -->
			<roundcube:object name="addresslist" id="contacts-table" class="bc-recordlist bc-contactlist"
				noheader="true" aria-labelledby="bc-label-contactslist" />
		</div>

		<roundcube:include file="/templates/includes/pagenav.html" />
	</div>

	<main id="layout-content" class="bc-reading"
		aria-label="<roundcube:label name='contactproperties' />">

		<!-- Below 768px this pane covers the list (§6, D-79), so it needs a way back
		     that it does not need at any other width. Hidden by default and shown only
		     by the narrow breakpoint; ui.js binds it in initReadingBack(). -->
		<button type="button" class="bc-reading__back">
			<svg class="bc-icon" aria-hidden="true"><use href="#ic_fluent_chevron_down_20_regular" /></svg>
			<span><roundcube:label name="bc_back" /></span>
		</button>

		<!-- The detail toolbar that stood here moved into the ribbon at D-77, with
		     the More popover and the contactmenu container whole. It always acted on
		     the parent's list selection rather than on the frame, so the ribbon —
		     which is in this same document — reaches it exactly as this did, and
		     core still enables and disables it from contactlist_select(). -->

		<roundcube:object name="contentframe" id="contact-frame" class="bc-reading__frame"
			src="env:blankpage" title="contactproperties" />

		<div class="bc-empty bc-reading__empty">
			<svg class="bc-empty__icon" aria-hidden="true"><use href="#ic_fluent_contact_card_20_regular" /></svg>
			<p class="bc-empty__title"><roundcube:label name="bc_nocontactselected" /></p>
			<p class="bc-empty__text"><roundcube:label name="bc_pickcontact" /></p>
		</div>
	</main>
</div>

<!-- ui.js needs these client-side: the second line of a group row, and the two
     empty-list states. -->
<roundcube:add_label name="group" />
<roundcube:add_label name="nocontactsfound" />
<roundcube:add_label name="bc_nocontacts" />
<roundcube:add_label name="bc_noresults" />

<roundcube:include file="/templates/includes/footer.html" />
